{{ define "main" }}

<div class="hero">
  <h1>{{ site.Params.tagline }}</h1>
  <p>{{ site.Params.description }}</p>
</div>

<section>
  <h2 class="section-title"><span>文章</span></h2>
  <ul class="list">
    {{ range where site.RegularPages "Section" "posts" }}
    <li>
      <a href="{{ .RelPermalink }}">
        <div class="item-title">{{ .Title }}</div>
        <div class="item-meta">{{ .Date.Format "2006-01-02" }} · 约 {{ .ReadingTime }} 分钟</div>
      </a>
    </li>
    {{ else }}
    <li><div class="item-meta">还没有文章。</div></li>
    {{ end }}
  </ul>
</section>

{{ end }}
